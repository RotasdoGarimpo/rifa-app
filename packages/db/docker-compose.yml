name: rifa-app

services:
  postgres:
    image: postgres:18
    container_name: rifa-app-postgres
    environment:
      POSTGRES_DB: rifa-app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - rifa-app_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  rifa-app_postgres_data:
